; ==========================================
; Notebook Borrow System
; PHP 8.2 Production Configuration
; ==========================================

; Security
display_errors=Off
display_startup_errors=Off
expose_php=Off

; Error Logging
log_errors=On
error_reporting=E_ALL

; Resource Limits
memory_limit=256M
max_execution_time=120

; Upload Limits
upload_max_filesize=20M
post_max_size=20M

; Timezone
date.timezone=Asia/Bangkok